name: Deploy rahina.juliarta.com

on:
  push:
    branches: [main]
  workflow_dispatch: # bisa juga dijalankan manual dari tab Actions

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: /home/u181728200/domains/rahina.juliarta.com
      PHP: php # pakai wrapper CloudLinux agar ekstensi dari "Select PHP Version" ikut dimuat
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      REMOTE: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Build frontend (React/Inertia) di GitHub, bukan di server hosting
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      # 2. Bungkus kode + hasil build (tanpa vendor, node_modules, .env, storage)
      - name: Package release
        run: |
          tar -czf /tmp/release.tar.gz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./vendor' \
            --exclude='./storage' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./.htaccess' \
            --exclude='./.well-known' \
            --exclude='./public/storage' \
            --exclude='./public/hot' \
            .
          ls -lh /tmp/release.tar.gz

      # 3. Siapkan SSH key untuk koneksi aman ke shared hosting
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $SSH_PORT -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # 4. Upload paket lewat SSH ke server (tanpa rsync)
      - name: Upload release package
        run: |
          ssh -i ~/.ssh/deploy_key -p $SSH_PORT "$REMOTE" "cat > ~/release.tar.gz" < /tmp/release.tar.gz

      # 5. Ekstrak + composer install + artisan di server shared hosting
      - name: Install on server
        run: |
          ssh -i ~/.ssh/deploy_key -p $SSH_PORT "$REMOTE" "
            set -e
            cd $APP_DIR
            $PHP artisan down --retry=15 || true
            trap '$PHP artisan up' EXIT

            # Hapus build lama agar diganti dengan build terbaru
            rm -rf public/build
            tar -xzf ~/release.tar.gz -C $APP_DIR --no-same-owner
            rm -f ~/release.tar.gz

            # Pastikan folder runtime storage & cache tersedia dan memiliki izin tulis
            mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Deteksi lokasi Composer di shared hosting (CloudLinux / cPanel)
            if [ -f \"\$HOME/bin/composer\" ]; then
              $PHP \$HOME/bin/composer install --no-dev --optimize-autoloader --no-interaction
            elif [ -f \"\$HOME/composer.phar\" ]; then
              $PHP \$HOME/composer.phar install --no-dev --optimize-autoloader --no-interaction
            else
              composer install --no-dev --optimize-autoloader --no-interaction
            fi

            # Jalankan migrasi basis data
            $PHP artisan migrate --force

            # Buat symlink storage jika belum ada
            $PHP artisan storage:link || true

            # Optimasi cache Laravel untuk performa produksi
            $PHP artisan optimize:clear
            $PHP artisan optimize
          "
